# Merge with compose.yaml. Enable image.ocr and supply the existing Redis/queue
# settings in app.toml; `serve` initializes those application services.
services:
  inferkit:
    command: ["--config", "/etc/inferkit/app.toml", "serve"]
    volumes:
      - type: bind
        source: ${INFERKIT_OCR_MODEL:-./pp-ocrv6-medium}
        target: /models/ocr
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 3 --output /dev/null http://127.0.0.1:$${PORT}/ocr"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
