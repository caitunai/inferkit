name: Debian 11 CPU compatibility
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  native-amd64:
    runs-on: ubuntu-latest
    container: debian:bullseye
    steps:
      - name: Install Debian 11 build and runtime libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git binutils libstdc++6 libgcc-s1 python3
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prepare pinned ONNX Runtime CPU library
        run: |
          bash scripts/prepare-onnxruntime-linux.sh "$RUNNER_TEMP/onnxruntime"
          version=$(cat "$RUNNER_TEMP/onnxruntime/VERSION_NUMBER")
          printf 'ONNXRUNTIME_SHARED_LIBRARY_PATH=%s/onnxruntime/lib/libonnxruntime.so.%s\n' "$RUNNER_TEMP" "$version" >> "$GITHUB_ENV"
      - name: Build and check Debian 11 ELF dependencies
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -trimpath -o "$RUNNER_TEMP/inferkit" .
          bash scripts/check-debian11-abi.sh "$RUNNER_TEMP/inferkit" "$ONNXRUNTIME_SHARED_LIBRARY_PATH" "$RUNNER_TEMP/onnxruntime/lib/libonnxruntime_providers_shared.so"
      - name: Exercise the native C API and CPU tensor lifecycle
        run: |
          go test -v github.com/yalue/onnxruntime_go -run '^(TestGetVersion|TestCreateTensor)$'
          go test ./services/imagefilter ./api/handler ./api/server
      - name: Verify deployment script guards
        run: python3 -B -m unittest discover -s scripts/tests -v
